<script>
'use strict';
const $=id=>document.getElementById(id), sharp=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],flat=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
let chart=null,displayChart=null,sample=null,clockOffset=null,rtt=0,connected=false,lastReceived=0,lastBar=0,lastActive=null,cells=new Map(),sections=[],clockBusy=false,clockController=null,clockProbe=null,page='chords',device=null,assignment=null,scoreView=null,renderGeneration=0;
const calibration=new window.ChordCueDeviceClient.ClockCalibration();
const nativeClockOrigin=Math.floor(Math.random()*2**40);let nativeClockSequence=0;
let lastChartRow=null;
function resetClock(session=calibration.session){calibration.reset(session);clockOffset=null;clockProbe=null;clockController?.abort();clockController=null;clockBusy=false;window.ChordCueMetronome?.cancel();}
function clockHealth(){const diagnostics=calibration.diagnostics(performance.now(),Date.now());if(diagnostics.status==='valid')clockOffset=calibration.offset;else if(clockOffset!==null){clockOffset=null;window.ChordCueMetronome?.cancel();}return diagnostics;}
const mod=n=>(n%12+12)%12;
const hostLabel=()=>window.ChordCueHostLabel||(sample?.playback?'主机':'Logic');
function setting(id,fallback){try{return localStorage.getItem('chordcue-lan-'+id)||fallback}catch{return fallback}}
function changePage(value){page=value;const chords=['chords','numbers'].includes(value);$('metronome').hidden=value!=='metronome';$('chart').hidden=!chords;$('score').hidden=!['staff','tab'].includes(value);scoreView?.setActive(['staff','tab'].includes(value));lastChartRow=null;$('empty').hidden=!chords||!!displayChart?.events.length;document.querySelector('header .controls').hidden=value==='metronome';$('chordTab').classList.toggle('selected',value!=='metronome');$('metroTab').classList.toggle('selected',value==='metronome');}
$('chordTab').addEventListener('click',()=>changePage(chart?.score?assignment?.view||'staff':'chords'));$('metroTab').addEventListener('click',()=>changePage('metronome'));
$('notation').value=setting('notation','chords');if(!$('notation').value)$('notation').value='chords';
$('key').value=setting('key','track');if(!$('key').value)$('key').value='track';
for(const id of ['notation','key'])$(id).addEventListener('change',()=>{try{localStorage.setItem('chordcue-lan-'+id,$(id).value)}catch{}if(chart?.score&&assignment)void applyAssignment(assignment,chart);else renderChart();lastActive=null});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}});
$('follow').addEventListener('change',()=>{scoreView?.setFollow($('follow').checked);lastChartRow=null;});
window.addEventListener('resize',()=>{lastChartRow=null;});
function offset(p){return p.beat-1+(p.division-1)/4+p.tick/960}
function compare(a,b){return a.bar-b.bar||offset(a)-offset(b)}
function activeIndex(position){if(!displayChart)return -1;let lo=0,hi=displayChart.events.length;while(lo<hi){const mid=(lo+hi)>>1;if(compare(displayChart.events[mid],position)<=0)lo=mid+1;else hi=mid}return lo-1}
function shift(){return !chart||$('key').value==='track'||chart.score&&(!sections.length||sections[0].unknown)||assignment?.view==='tab'?0:Number($('key').value)-(sections[0]?.family||0)}
function note(p){const target=mod((sections[0]?.family||0)+shift());return ([1,3,5,8,10].includes(target)?flat:sharp)[mod(p)]}
function transpose(symbol){if(!shift()||symbol==='N.C.')return symbol;return symbol.split('/').map(part=>{const m=part.match(/^([A-G])([♯♭#b]?)(.*)$/);if(!m)return part;let pitch={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];pitch+=['♯','#'].includes(m[2])?1:['♭','b'].includes(m[2])?-1:0;return note(pitch+shift())+m[3]}).join('/')}
function formatted(event){return $('notation').value==='numbers'?event.number:transpose(event.symbol).replaceAll('7','₇')}
function keyLabel(section){if(section.unknown)return '调号未知';let label='1='+note(section.family+shift());if(section.minor)label+=' · 6='+note(section.root+shift())+' 小调';return label}
function renderChart(){
 if(!chart)return;displayChart ||= chart;sections=displayChart.sections;$('name').textContent=chart.name;$('empty').hidden=!['chords','numbers'].includes(page)||displayChart.events.length>0;$('empty').textContent=chart.score?'此声部没有源和弦标注，请在主机选择五线谱或 TAB。':'等待主机的和弦谱…';
 const root=$('chart');root.replaceChildren();cells.clear();lastBar=0;lastChartRow=null;
 const count=Number.isInteger(displayChart.bars)&&displayChart.bars>0?displayChart.bars:displayChart.measures?.length||Math.max(16,displayChart.events.at(-1)?.bar||1,sample?.bar||1);
 let cursor=0,carry=null;
 for(let bar=1;bar<=count;bar++){
  const measure=displayChart.measures?.[bar-1],beatUnit=measure?4/measure.meter.denominator:1;
  const cell=document.createElement('section');cell.className='bar';const head=document.createElement('div');head.className='barhead';head.textContent=measure?.number??measure?.sourceNumber??String(bar);
  const section=sections.find(s=>s.bar===bar);if(section&&$('notation').value==='numbers'){const k=document.createElement('span');k.className='key';k.textContent=keyLabel(section);head.append(k)}cell.append(head);
  const row=document.createElement('div');row.className='slots';const events=[];while(cursor<displayChart.events.length&&displayChart.events[cursor].bar===bar)events.push(displayChart.events[cursor++]);
  const slots=[];
  function slot(event,text,gray,start){const el=document.createElement('div');el.className='slot'+(gray?' carry':'');const title=document.createElement('div');title.className='symbol';title.textContent=text;el.append(title);if(start!==null){const beat=document.createElement('span');beat.className='onset';beat.textContent='第 '+(start/beatUnit+1).toFixed(2).replace(/\.00$/,'')+' 拍';el.append(beat)}row.append(el);slots.push({id:event?.id??null,el})}
  if(!events.length)slot(carry,carry?'%':'·',true,null);
  else{if(offset(events[0])>0.04)slot(carry,carry?'—':'·',true,0);for(const event of events)slot(event,formatted(event),false,offset(event));carry=events.at(-1)}
  cell.append(row);const line=document.createElement('div');line.className='cursor';cell.append(line);root.append(cell);cells.set(bar,{cell,line,slots});
 }
}
function showError(message){$('scoreError').textContent=message;$('scoreError').hidden=!message;}
async function applyAssignment(next,nextChart){
 const generation=++renderGeneration;window.ChordCueMetronome?.cancel();assignment=next;chart=nextChart;
 const views={staff:'五线谱',tab:'源 TAB',chords:'和弦',numbers:'级数',metronome:'节拍器'};
 try{
  const part=chart.score?.parts.find(part=>part.id===next.partId);
  if(chart.score&&!part)throw Error('分配的声部不在当前谱面中');
  displayChart=chart.score?window.ChordCueDeviceClient.partChart(chart,next.partId):chart;sections=displayChart.sections;
  $('assignment').textContent='本机：'+next.label+' · '+(part?.name||'和弦工程')+' · '+views[next.view];
  $('name').textContent=chart.name;showError('');
  $('notation').disabled=!!chart.score;$('key').disabled=!!chart.score&&(next.view==='tab'||!sections.length||sections[0].unknown);
  $('chordTab').textContent=chart.score?(views[next.view]==='节拍器'?'分配视图':views[next.view]):'和弦谱';
  if(chart.score){$('notation').value=next.view==='numbers'?'numbers':'chords';changePage(next.view);}else if(!['chords','metronome'].includes(page))changePage('chords');
  if(chart.score&&['staff','tab'].includes(next.view)){
   scoreView ||= new window.ChordCueScoreView.ScoreView($('score'),{assetBase:'vendor/alphatab/dist/',topInset:()=>document.querySelector('header').getBoundingClientRect().height});
   await scoreView.show(chart.score,next.partId,next.view,shift());
  }else if(next.view!=='metronome')renderChart();
  if(chart.score&&next.view==='numbers'&&displayChart.events.some(event=>!event.keyKnown))showError('部分源和弦缺少已知调号，保留原和弦文字。');
  return generation===renderGeneration;
 }catch(error){if(generation===renderGeneration)showError(error.message||'谱面显示失败');return false;}
}
async function calibrate(){
 clockHealth();if(clockBusy)return;clockBusy=true;const probe=calibration.begin(performance.now(),Date.now());clockProbe=probe;
 if(window.ChordCueNative){const t0=probe.nativeToken=nativeClockOrigin+(++nativeClockSequence);if(window.ChordCueBridge)window.ChordCueBridge.clock(t0);else window.webkit?.messageHandlers?.clock?.postMessage({t0});setTimeout(()=>{if(clockProbe===probe){clockProbe=null;clockBusy=false}},2500);return}
 const controller=new AbortController();clockController=controller;const timeout=setTimeout(()=>controller.abort(),2500);
 try{const response=await fetch('clock',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('clock');const data=await response.json(),t3=performance.now();
  applyClock(data,probe,t3);
 }catch{}finally{clearTimeout(timeout);if(clockProbe===probe){clockController=null;clockProbe=null;clockBusy=false}}
}
function applyClock(data,probe,t3){const generation=calibration.generation;if(clockProbe!==probe||!calibration.accept(data,probe,t3,Date.now()))return;if(clockOffset!==null&&generation!==calibration.generation)window.ChordCueMetronome?.cancel();clockOffset=calibration.offset;rtt=calibration.best.rtt;}
window.acceptNativeClock=(data,t0)=>{const probe=clockProbe;if(!probe||probe.nativeToken!==t0)return;if(typeof data?.session==='string'&&data.session&&calibration.session&&data.session!==calibration.session){resetClock(data.session);sample=null;calibrate();return;}applyClock(data,probe,performance.now());if(clockProbe===probe){clockProbe=null;clockBusy=false}};
function acceptTransport(next){const route=next.route||(chart?.revision===next.revision?chart.route:null)||(sample?.revision===next.revision&&next.routeId&&sample.routeId===next.routeId?sample.route:null);if(route)next={...next,route};window.ChordCueMetronome?.transportChanged(sample,next);sample=next;lastReceived=performance.now();if(next.playback)document.querySelector('footer').textContent='显示设置仅影响你的浏览器。工程和播放位置跟随主机。每个和弦下方标注起拍；蓝线表示播放位置。网络往返和采样耗时不是总同步误差。';}
window.acceptNativeState=value=>{if(!chart||chart.name!==value.name||chart.revision!==value.transport.revision){window.ChordCueMetronome?.cancel();chart={revision:value.transport.revision,name:value.name,meter:value.transport.meter,events:[],sections:[]};displayChart=chart;$('name').textContent=value.name;}if(value.transport.route)chart.route=value.transport.route;else if(sample?.routeId&&sample.routeId!==value.transport.routeId)delete chart.route;connected=true;acceptTransport(value.transport);if(typeof value.audioEnabled==='boolean')window.ChordCueMetronome?.setEnabled(value.audioEnabled);};
function connect(){
 device=new window.ChordCueDeviceClient.DeviceClient({
  onSession:value=>{if(calibration.session!==value){resetClock(value);sample=null;}},
  onConnection:value=>{connected=value;lastActive=null;resetClock();if(value){calibrate()}else{$('current').textContent='—';sample=null;window.ChordCueMetronome?.cancel(true);scoreView?.setPosition(null);}},
  onChart:next=>{if(chart?.name!==next.name||chart?.revision!==next.revision){window.ChordCueMetronome?.cancel();++renderGeneration;}chart=next;lastActive=null;if(!next.score){displayChart=next;renderChart();}},
  onTransport:acceptTransport,applyAssignment,
  onError:error=>{showError(error.message||'设备连接失败');window.ChordCueMetronome?.cancel(true);},
  metrics:()=>{const diagnostics=clockHealth(),now=performance.now(),age=sample&&clockOffset!==null?now+clockOffset-sample.sampleTime:null;return {rttMs:clockOffset===null?null:rtt,clockOffsetMs:clockOffset,clockDiagnostics:diagnostics,audioOutputDelayMs:window.ChordCueMetronome?.diagnostics().audioOutputDelayMs??null,freshnessMs:age!==null&&age>=0?age:null,syncStatus:document.hidden?'disabled':diagnostics.status==='calibrating'?'calibrating':diagnostics.status==='valid'&&window.ChordCueDeviceClient.transportFresh(sample,chart,now,clockOffset,lastReceived,connected)?'synchronized':'stale'};}
 });
 device.start();
}
function frame(){
 const diagnostics=clockHealth(),now=performance.now(),rawAge=sample&&clockOffset!==null?now+clockOffset-sample.sampleTime:Infinity,age=Math.max(0,rawAge);
 const assigned=!chart?.score||!!device?.snapshot().applied;
 const fresh=assigned&&diagnostics.status==='valid'&&window.ChordCueDeviceClient.transportFresh(sample,chart,now,clockOffset,lastReceived,connected);
 const predicting=fresh&&sample.precise&&age<200&&clockOffset!==null;
 if(sample){$('metadata').textContent=sample.meter+' · '+(sample.bpm>0?Number(sample.bpm.toFixed(2))+' BPM':'— BPM')}
 if(fresh&&chart&&window.ChordCueTimeline){
  const targetTime=sample.sampleTime+(predicting?Math.min(age,150):0);
  let visible=window.ChordCueTimeline.position(sample,targetTime,{clampToBar:true});
  let routePosition=null;try{if(sample.route)routePosition=window.ChordCuePlaybackPlan?.position(sample.route,sample,targetTime);}catch(error){showError(error.message||'播放路线无效');window.ChordCueMetronome?.cancel(true);}
  const sourceId=routePosition?.sourceMeasureId||sample.sourceMeasureId,sourceMeasures=chart.score?.measures||chart.measures,sourceIndex=sourceMeasures?.findIndex(measure=>measure.id===sourceId);
  if(sourceIndex>=0){const measure=sourceMeasures[sourceIndex],source=routePosition?.sourceOffsetQuarter??sample.sourceOffsetQuarter,offsetQuarter=typeof source==='number'?source:source?source.numerator/source.denominator:0;visible={bar:sourceIndex+1,offset:Math.min(measure.duration.numerator/measure.duration.denominator,offsetQuarter)};}
  const measure=displayChart?.measures?.[visible.bar-1],beatUnit=measure?4/measure.meter.denominator:1,beats=measure?measure.duration.numerator/measure.duration.denominator:Number(sample.meter.split('/')[0])||4,predicted=visible.offset;
  const currentMeter=routePosition?.meter||(measure?measure.meter.numerator+'/'+measure.meter.denominator:sample.meter),currentBpm=routePosition?.bpm??sample.bpm;
  $('metadata').textContent=currentMeter+' · '+(currentBpm>0?Number(currentBpm.toFixed(2))+' BPM':'— BPM');
  const position={bar:visible.bar,beat:1,division:1,tick:predicted*960};
  const index=activeIndex(position),event=displayChart?.events[index];
  if(index!==lastActive){$('current').textContent=event?formatted(event):'—';for(const {slots} of cells.values())for(const s of slots)s.el.classList.toggle('currentSlot',s.id!==null&&s.id===event?.id);lastActive=index}
  if(lastBar!==visible.bar){cells.get(lastBar)?.cell.classList.remove('active');cells.get(visible.bar)?.cell.classList.add('active');lastBar=visible.bar}
  const current=cells.get(visible.bar);
  if(current&&['chords','numbers'].includes(page)&&sample.playing&&!sample.preparing&&$('follow').checked){
   const row=current.cell.offsetTop+':'+sample.discontinuity;
   if(row!==lastChartRow){lastChartRow=row;$('chart').style.paddingBottom=window.innerHeight+'px';window.scrollTo({top:Math.max(0,window.scrollY+current.cell.getBoundingClientRect().top-document.querySelector('header').getBoundingClientRect().height),behavior:'instant'});}
  }
  const cell=cells.get(visible.bar);if(cell)cell.line.style.left=(8+(cell.cell.clientWidth-16)*Math.min(1,predicted/beats))+'px';
  if(scoreView&&['staff','tab'].includes(page)){scoreView.setFollow($('follow').checked);scoreView.setPosition({...sample,...routePosition,sourceMeasureId:sourceId||measure?.id,sourceOffsetQuarter:predicted});}
  $('position').textContent='第 '+(measure?.number??measure?.sourceNumber??visible.bar)+' 小节 · 第 '+Math.min(Math.ceil(beats/beatUnit),Math.floor(predicted/beatUnit)+1)+' 拍';
 }
 else{if(lastBar)cells.get(lastBar)?.cell.classList.remove('active');lastBar=0;lastActive=null;lastChartRow=null;scoreView?.setPosition(null);$('current').textContent='—'}
 const state=!connected?'连接中断，正在重连…':!assigned?'正在应用主机分配…':!sample?.valid?'主机尚未读到 '+hostLabel()+' 播放头':clockOffset===null?'正在校准时钟…':!fresh?'位置数据已过期，等待主机…':sample.playing&&sample.rate>0?'跟随播放':'停止／定位中';
 $('status').textContent=state+(clockOffset!==null?' · 网络往返 '+rtt.toFixed(0)+' ms':'')+(sample?' · 读取耗时 '+sample.readMs.toFixed(0)+' ms':'')+(sample&&!sample.precise?' · 当前只能按拍同步':'');
 window.ChordCueMetronome?.visual();
 requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{resetClock();if(document.hidden){if(!window.ChordCueNative)window.ChordCueMetronome?.disable()}else{calibrate();lastBar=0;lastActive=null}});
window.ChordCueSync={snapshot:()=>{const clockDiagnostics=clockHealth();return {sample,chart,clockOffset,clockDiagnostics,connected:connected&&(!chart?.score||!!device?.snapshot().applied),lastReceived,rtt,page,assignment,device:device?.snapshot()};},calibrate};
window.addEventListener('pagehide',()=>{resetClock();device?.stop();window.ChordCueMetronome?.cancel(true);});
window.addEventListener('pageshow',event=>{if(event.persisted&&!window.ChordCueNative)device?.start();});
if(window.ChordCueNative){document.body.classList.add('native');changePage('metronome')}else{connect();if(location.hash==='#metronome')changePage('metronome')}
calibrate();setTimeout(calibrate,300);setTimeout(calibrate,800);setInterval(calibrate,3000);requestAnimationFrame(frame);
