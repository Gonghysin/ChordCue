[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "chordcue-windows"
version = "0.2.0"
description = "Standalone ChordCue desktop for Windows"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["PySide6==6.11.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pytest-asyncio>=1,<2", "ruff>=0.12", "mypy>=1.15", "pypdf>=5", "cx-Freeze==8.7.1"]

[project.gui-scripts]
chordcue = "chordcue.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
